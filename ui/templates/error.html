{% extends "base.html" %}

{% block title %}Error - Founder Socials AI Agent{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-sm p-8 text-center">
        <div class="mb-6">
            <svg class="w-16 h-16 text-red-500 mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
            </svg>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Oops! Something went wrong</h1>
        <p class="text-gray-600 mb-6">
            {% if error %}
                {{ error }}
            {% else %}
                An unexpected error occurred. Please try again.
            {% endif %}
        </p>
        
        <div class="space-y-3">
            <button onclick="window.location.href='/'" class="w-full bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
                Go to Dashboard
            </button>
            <button onclick="window.history.back()" class="w-full bg-gray-200 text-gray-800 px-4 py-2 rounded-lg hover:bg-gray-300 transition-colors">
                Go Back
            </button>
        </div>
    </div>
</div>
{% endblock %}
